<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GROW — AI powered sales assistant</title>
    <meta name="description" content="GROW: AI powered Sales Companion for all sales professionals. Join the movement and discover how you will grow.">

    <!-- Open Graph Tags -->
    <meta property="og:title" content="GROW — AI powered sales assistant">
    <meta property="og:description" content="AI powered Sales Companion for all sales professionals">
    <meta property="og:type" content="website">

    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-orange: #FF7A00;
            --primary-green: #21C179;
            --black: #000000;
            --white: #FFFFFF;
            --gray: #808080;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--black);
            color: var(--white);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Header Styles */
        header {
            position: sticky;
            top: 0;
            background-color: var(--black);
            z-index: 1000;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 3rem;
        }

        .logo-link {
            display: inline-block;
        }

        .logo {
            height: 20px;
            width: auto;
            cursor: pointer;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--white);
            text-decoration: none;
            font-size: 0.95rem;
            transition: opacity 0.2s ease;
        }

        .nav-links a:hover {
            opacity: 0.7;
        }

        .nav-links a:focus {
            outline: 2px solid var(--primary-orange);
            outline-offset: 4px;
        }

        .cta-button {
            background-color: var(--primary-orange);
            color: var(--black);
            padding: 0.7rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .cta-button:hover {
            opacity: 0.9;
        }

        .cta-button:focus {
            outline: 2px solid var(--white);
            outline-offset: 2px;
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 6rem 2rem 3rem;
        }

        .hero h1 {
            font-size: clamp(2rem, 5vw, 3.75rem);
            font-weight: 600;
            letter-spacing: -0.02em;
            line-height: 1.2;
            margin-bottom: 3rem;
        }

        .hero-animation {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        /* Signup Section */
        .signup-section {
            padding: 4rem 2rem;
            text-align: center;
        }

        .signup-content {
            max-width: 600px;
            margin: 0 auto;
        }

        .signup-content h2 {
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
        }

        .signup-form {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .email-input {
            flex: 1;
            min-width: 250px;
            padding: 0.8rem 1.2rem;
            border: 1px solid var(--gray);
            border-radius: 8px;
            background-color: var(--black);
            color: var(--white);
            font-size: 1rem;
            transition: border-color 0.2s ease;
        }

        .email-input:focus {
            outline: none;
            border-color: var(--primary-orange);
        }

        .email-input.error {
            border-color: #ff4444;
        }

        .email-input.success {
            border-color: var(--primary-green);
        }

        .signup-button {
            background-color: var(--primary-orange);
            color: var(--black);
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .signup-button:hover {
            opacity: 0.9;
        }

        .signup-button:focus {
            outline: 2px solid var(--white);
            outline-offset: 2px;
        }

        .validation-message {
            margin-top: 0.5rem;
            font-size: 0.9rem;
            min-height: 1.5rem;
        }

        .validation-message.error {
            color: #ff4444;
        }

        .validation-message.success {
            color: var(--primary-green);
        }

        /* Brand Section */
        .brand-section {
            padding: 6rem 2rem;
        }

        .brand-container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: auto 2px 1fr;
            gap: 4rem;
            align-items: center;
        }

        .brand-left {
            text-align: left;
        }

        .brand-logo {
            height: 40px;
            width: auto;
            margin-bottom: 1rem;
        }

        .brand-tagline {
            font-size: 1.1rem;
            font-weight: 400;
        }

        .brand-divider {
            width: 2px;
            height: 200px;
            background-color: var(--white);
        }

        .brand-right {
            font-size: 1.8rem;
            font-weight: 300;
            line-height: 1.8;
        }

        /* Awards Section */
        .awards-section {
            background-color: var(--primary-green);
            color: var(--black);
            padding: 5rem 2rem;
            text-align: center;
        }

        .awards-question {
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            font-weight: 500;
            margin-bottom: 4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .awards-logo {
            height: 36px;
            width: auto;
            display: inline-block;
            vertical-align: middle;
        }

        .awards-strip {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto;
        }

        .award-placeholder {
            width: 150px;
            height: 80px;
            background-color: var(--gray);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: var(--white);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
            }

            .header-left {
                flex-direction: column;
                gap: 1rem;
                width: 100%;
            }

            .nav-links {
                gap: 1rem;
            }

            .hero {
                padding: 3rem 1rem 2rem;
            }

            .signup-form {
                flex-direction: column;
            }

            .email-input {
                min-width: 100%;
            }

            .brand-container {
                grid-template-columns: 1fr;
                gap: 2rem;
                text-align: center;
            }

            .brand-divider {
                width: 100%;
                height: 2px;
            }

            .brand-left {
                text-align: center;
            }

            .awards-question {
                flex-direction: column;
            }

            .award-placeholder {
                width: 120px;
                height: 60px;
            }
        }

        @media (max-width: 480px) {
            .nav-links {
                font-size: 0.85rem;
            }

            .cta-button {
                padding: 0.6rem 1.5rem;
                font-size: 0.85rem;
            }
        }

        /* Accessibility */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-left">
            <a href="#top" class="logo-link" aria-label="GROW home">
                <img src="assets/logo.svg" alt="GROW logo" class="logo">
            </a>
            <nav>
                <ul class="nav-links">
                    <li><a href="#about">About Us</a></li>
                    <li><a href="#contact">Contact Us</a></li>
                </ul>
            </nav>
        </div>
        <a href="#signup" class="cta-button">Sign up</a>
    </header>

    <!-- Hero Section -->
    <section class="hero" id="top">
        <div class="container">
            <h1>How will you GROW?</h1>
            <img src="assets/grow-animation.gif" alt="Grow animation" class="hero-animation" loading="lazy">
        </div>
    </section>

    <!-- Signup Section -->
    <section class="signup-section" id="signup">
        <div class="signup-content">
            <h2>Join the movement</h2>
            <form class="signup-form" id="signupForm" novalidate>
                <input
                    type="email"
                    id="emailInput"
                    class="email-input"
                    placeholder="Enter your email"
                    required
                    aria-label="Email address"
                    aria-describedby="validationMessage"
                >
                <button type="submit" class="signup-button">Sign up</button>
            </form>
            <div id="validationMessage" class="validation-message" role="alert" aria-live="polite"></div>
        </div>
    </section>

    <!-- Brand / Message Section -->
    <section class="brand-section" id="about">
        <div class="brand-container">
            <div class="brand-left">
                <img src="assets/logo.svg" alt="GROW logo" class="brand-logo">
                <p class="brand-tagline">AI powered Sales Companion</p>
            </div>
            <div class="brand-divider" role="presentation"></div>
            <div class="brand-right">
                of,<br>
                by,<br>
                for all Sales Professionals
            </div>
        </div>
    </section>

    <!-- Awards Section -->
    <section class="awards-section" id="contact">
        <div class="container">
            <div class="awards-question">
                <span>How will you win with</span>
                <img src="assets/logo.svg" alt="GROW" class="awards-logo">
                <span>?</span>
            </div>

            <div class="awards-strip">
                <div class="award-placeholder" role="img" aria-label="Award Placeholder 1">
                    Award
                </div>
                <div class="award-placeholder" role="img" aria-label="Award Placeholder 2">
                    Award
                </div>
                <div class="award-placeholder" role="img" aria-label="Award Placeholder 3">
                    Award
                </div>
                <div class="award-placeholder" role="img" aria-label="Award Placeholder 4">
                    Award
                </div>
                <div class="award-placeholder" role="img" aria-label="Award Placeholder 5">
                    Award
                </div>
            </div>
        </div>
    </section>

    <script>
        // Email validation and form submission
        const form = document.getElementById('signupForm');
        const emailInput = document.getElementById('emailInput');
        const validationMessage = document.getElementById('validationMessage');
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        function validateEmail(email) {
            return emailRegex.test(email);
        }

        function showValidationMessage(message, type) {
            validationMessage.textContent = message;
            validationMessage.className = `validation-message ${type}`;
        }

        function clearValidationMessage() {
            validationMessage.textContent = '';
            validationMessage.className = 'validation-message';
        }

        emailInput.addEventListener('input', function() {
            clearValidationMessage();
            emailInput.classList.remove('error', 'success');
        });

        emailInput.addEventListener('blur', function() {
            const email = emailInput.value.trim();
            if (email && !validateEmail(email)) {
                emailInput.classList.add('error');
                showValidationMessage('Please enter a valid email address', 'error');
            }
        });

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const email = emailInput.value.trim();

            if (!email) {
                emailInput.classList.add('error');
                showValidationMessage('Email address is required', 'error');
                emailInput.focus();
                return;
            }

            if (!validateEmail(email)) {
                emailInput.classList.add('error');
                showValidationMessage('Please enter a valid email address', 'error');
                emailInput.focus();
                return;
            }

            // Mock successful submission
            emailInput.classList.remove('error');
            emailInput.classList.add('success');
            showValidationMessage('Thank you for joining the movement!', 'success');

            // Reset form after 3 seconds
            setTimeout(() => {
                form.reset();
                emailInput.classList.remove('success');
                clearValidationMessage();
            }, 3000);
        });

        // Smooth scrolling for navigation links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });

        // Logo click scrolls to top
        document.querySelector('.logo-link').addEventListener('click', function(e) {
            e.preventDefault();
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });
    </script>
</body>
</html>
